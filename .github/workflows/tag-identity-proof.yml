name: Tag identity research prototypes
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/tag-name/**'
      - 'tests/fixtures/tag-name-policy-vectors.json'
      - 'android/app/src/main/java/com/myvault/app/data/{AppDatabase,Entities,Daos}.kt'
      - '.github/workflows/tag-identity-proof.yml'
permissions:
  contents: read
jobs:
  sql-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tag_identity_proof
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d tag_identity_proof"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MYVAULT_DISPOSABLE_DATABASE: '1'
      MYVAULT_PROOF_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/tag_identity_proof
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.13
      - name: Run SQL proof
        run: |
          set -o pipefail
          node --experimental-sqlite experiments/tag-name/sql-proof.mjs | tee "$RUNNER_TEMP/sql-proof.log"
          while IFS= read -r line; do echo "::notice title=SQL proof::$line"; done < "$RUNNER_TEMP/sql-proof.log"
  android-driver-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [24, 29]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Build isolated proof APK
        run: |
          set -o pipefail
          bash android/gradlew -p experiments/tag-name/driver --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/driver-proof-build.log"
      - name: Surface build failure
        if: failure()
        run: |
          python3 -c 'import os,pathlib; s=pathlib.Path(os.environ["RUNNER_TEMP"],"driver-proof-build.log").read_text(errors="replace")[-6000:]; print("::error title=Driver build::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
      - name: Report native ABI sizes in proof APK
        run: python3 -c 'import zipfile; z=zipfile.ZipFile("experiments/tag-name/driver/app/build/outputs/apk/debug/app-debug.apk"); [print("::notice title=Native library::",i.filename,i.file_size,"bytes uncompressed") for i in z.infolist() if i.filename.endswith(".so")]'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test driver on isolated emulator database
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash experiments/tag-name/driver/run-device.sh
