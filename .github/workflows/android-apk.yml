name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type (release requires the Android signing secrets)"
        type: choice
        options:
          - debug
          - release
        default: debug
        required: true

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event_name }}-${{ github.ref }}-${{ inputs.build_type || 'debug' }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug APK, unit tests and release build check
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Test Android CI helpers
        run: bash android/ci/test.sh
      - name: Check Android app sources
        run: bash android/ci/check-project.sh
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
      - name: Run unit tests and build debug APK
        working-directory: android
        run: bash ci/run-gradle-check.sh :app:testDebugUnitTest :app:assembleDebug
      # The disposable key below never leaves this runner and is NOT a release credential.
      # It verifies that the real app can also be optimized and signed without exposing secrets to PRs.
      - name: Create disposable release-test key
        run: >-
          keytool -genkeypair -keystore "$RUNNER_TEMP/myvault-test.p12" -storetype PKCS12
          -alias myvault-test -keyalg RSA -keysize 2048 -validity 2
          -dname "CN=MyVault CI test only" -storepass temporary-test-password -keypass temporary-test-password
      - name: Build release with disposable key
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/myvault-test.p12
          ANDROID_KEYSTORE_PASSWORD: temporary-test-password
          ANDROID_KEY_ALIAS: myvault-test
          ANDROID_KEY_PASSWORD: temporary-test-password
        run: ./gradlew --no-daemon -PrequireReleaseSigning=true :app:assembleRelease
      - name: Verify disposable release signature
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/myvault-test.p12
          ANDROID_KEYSTORE_PASSWORD: temporary-test-password
          ANDROID_KEY_ALIAS: myvault-test
        run: bash android/ci/verify-signing.sh android/app/build/outputs/apk/release/app-release.apk
      - name: Remove disposable key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/myvault-test.p12"
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myvault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-tests:
    name: Android emulator tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
      - name: Compile the app and instrumentation tests
        working-directory: android
        run: bash ci/run-gradle-check.sh :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Room, backup and Compose UI tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          disable-spellchecker: true
          working-directory: android
          script: bash ci/run-device-tests.sh && MYVAULT_CAPTURE_FIXTURES=1 bash ci/run-offline-restart-test.sh
      - name: Upload test report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myvault-android-test-report
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Signed release APK
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require the default branch for signing
        env:
          CURRENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$CURRENT_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run signed releases from the default branch only."
            exit 1
          fi
      - name: Check out trusted sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check Android app sources
        run: bash android/ci/check-project.sh
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-disabled: true
      - name: Validate signing secrets and prepare keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash android/ci/prepare-signing.sh
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PrequireReleaseSigning=true :app:assembleRelease
      - name: Verify the release signature
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash android/ci/verify-signing.sh android/app/build/outputs/apk/release/app-release.apk
      - name: Remove the temporary keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/myvault-release.keystore"
      - name: Upload signed release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myvault-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
