name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type (release requires the Android signing secrets)"
        type: choice
        options:
          - debug
          - release
        default: debug
        required: true

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event_name }}-${{ github.ref }}-${{ inputs.build_type || 'debug' }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug APK and unit tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Test Android CI helpers
        run: bash android/ci/test.sh
      - name: Check Android app sources
        run: bash android/ci/check-project.sh
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
      - name: Run unit tests and build debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myvault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Signed release APK
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require the default branch for signing
        env:
          CURRENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$CURRENT_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run signed releases from the default branch only."
            exit 1
          fi
      - name: Check out trusted sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check Android app sources
        run: bash android/ci/check-project.sh
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-disabled: true
      - name: Validate signing secrets and prepare keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash android/ci/prepare-signing.sh
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PrequireReleaseSigning=true :app:assembleRelease
      - name: Verify the release signature
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash android/ci/verify-signing.sh android/app/build/outputs/apk/release/app-release.apk
      - name: Remove the temporary keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/myvault-release.keystore"
      - name: Upload signed release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myvault-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  scaffold-build-test:
    # TEMPORARY: validates Gradle and signing with dummy sources, without publishing an APK.
    name: Temporary isolated scaffold build check
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-disabled: true
      - name: Compile disposable scaffold and test release signing
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/myvault-build-scaffold"
          cp -a android "$root"
          mkdir -p "$root/app/src/main/java/com/myvault/app" "$root/app/src/main/res/mipmap-anydpi"
          printf '%s\n' 'package com.myvault.app' 'class MainActivity : androidx.activity.ComponentActivity()' > "$root/app/src/main/java/com/myvault/app/MainActivity.kt"
          printf '%s\n' 'package com.myvault.app' 'class MyVaultApplication : android.app.Application()' > "$root/app/src/main/java/com/myvault/app/MyVaultApplication.kt"
          printf '%s\n' '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48"><path android:fillColor="#555555" android:pathData="M0,0h48v48h-48z" /></vector>' > "$root/app/src/main/res/mipmap-anydpi/ic_launcher.xml"
          cp "$root/app/src/main/res/mipmap-anydpi/ic_launcher.xml" "$root/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml"
          cd "$root"
          report_failure() { tail -n 80 "$1" | sed 's/^/::error::/'; }
          if ! ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug > "$RUNNER_TEMP/scaffold-debug.log" 2>&1; then
            report_failure "$RUNNER_TEMP/scaffold-debug.log"
            exit 1
          fi
          if ./gradlew --no-daemon -PrequireReleaseSigning=true :app:assembleRelease > "$RUNNER_TEMP/scaffold-no-key.log" 2>&1; then
            echo '::error::Release build unexpectedly succeeded without a key.'
            exit 1
          fi
          if ! grep -q 'Release signing is incomplete' "$RUNNER_TEMP/scaffold-no-key.log"; then
            report_failure "$RUNNER_TEMP/scaffold-no-key.log"
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/scaffold-key.p12"
          export ANDROID_KEYSTORE_PASSWORD='temporary-ci-test-only' ANDROID_KEY_PASSWORD='temporary-ci-test-only' ANDROID_KEY_ALIAS='test-key'
          keytool -genkeypair -alias "$ANDROID_KEY_ALIAS" -keystore "$ANDROID_KEYSTORE_PATH" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Disposable CI test' >/dev/null 2>&1
          if ! ./gradlew --no-daemon -PrequireReleaseSigning=true :app:assembleRelease > "$RUNNER_TEMP/scaffold-release.log" 2>&1; then
            report_failure "$RUNNER_TEMP/scaffold-release.log"
            exit 1
          fi
          bash "$GITHUB_WORKSPACE/android/ci/verify-signing.sh" "$root/app/build/outputs/apk/release/app-release.apk"
          rm -f "$ANDROID_KEYSTORE_PATH"
          echo 'Disposable debug/release scaffold checks passed; no APK was published.'
