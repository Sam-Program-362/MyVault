name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type (release requires the Android signing secrets)"
        type: choice
        options:
          - debug
          - release
        default: debug
        required: true

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event_name }}-${{ github.ref }}-${{ inputs.build_type || 'debug' }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug APK, unit tests and release build check
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Test Android CI helpers
        run: bash android/ci/test.sh
      - name: Check Android app sources
        run: bash android/ci/check-project.sh
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
      - name: Run unit tests and build debug APK
        working-directory: android
        run: bash ci/run-gradle-check.sh :app:testDebugUnitTest :app:assembleDebug
      # The disposable key below never leaves this runner and is NOT a release credential.
      # It verifies that the real app can also be optimized and signed without exposing secrets to PRs.
      - name: Create disposable release-test key
        run: >-
          keytool -genkeypair -keystore "$RUNNER_TEMP/myvault-test.p12" -storetype PKCS12
          -alias myvault-test -keyalg RSA -keysize 2048 -validity 2
          -dname "CN=MyVault CI test only" -storepass temporary-test-password -keypass temporary-test-password
      - name: Build release with disposable key
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/myvault-test.p12
          ANDROID_KEYSTORE_PASSWORD: temporary-test-password
          ANDROID_KEY_ALIAS: myvault-test
          ANDROID_KEY_PASSWORD: temporary-test-password
        run: ./gradlew --no-daemon -PrequireReleaseSigning=true :app:assembleRelease
      - name: Verify disposable release signature
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/myvault-test.p12
          ANDROID_KEYSTORE_PASSWORD: temporary-test-password
          ANDROID_KEY_ALIAS: myvault-test
        run: bash android/ci/verify-signing.sh android/app/build/outputs/apk/release/app-release.apk
      - name: Remove disposable key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/myvault-test.p12"
      # Keep the release candidate unsigned on PRs; it cannot update an installation until
      # signed with that installation's real key. Production secrets are never exposed to PR code.
      - name: Build unsigned release candidate
        working-directory: android
        run: bash ci/run-gradle-check.sh :app:assembleRelease
      - name: Verify unsigned release candidate
        run: |
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          tools="$ANDROID_HOME/build-tools/34.0.0"
          unzip -tqq "$apk"
          "$tools/aapt" dump badging "$apk" | grep "^package: name='com.myvault.app' "
          permissions=$("$tools/aapt" dump permissions "$apk")
          if grep -q 'android.permission.INTERNET' <<< "$permissions"; then
            echo '::error::The standalone release must not request internet permission.'
            exit 1
          fi
          if "$tools/apksigner" verify "$apk" > /dev/null 2>&1; then
            echo '::error::The release candidate must be unsigned in PR builds.'
            exit 1
          fi
          echo 'Unsigned candidate is a valid, offline MyVault release APK.'
      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myvault-unsigned-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myvault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-tests:
    name: Android emulator tests (API ${{ matrix.api }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # The offline upgrade check builds the native APK that preceded this redesign.
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
      - name: Compile the app and instrumentation tests
        working-directory: android
        run: bash ci/run-gradle-check.sh :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Build the previous native APK for the offline update test
        run: |
          previous="$RUNNER_TEMP/myvault-previous"
          mkdir -p "$previous"
          # Archive a pinned commit without switching branches or changing the checked-out files.
          git archive 8f28127f4eb23310059f7e96b44957d523c8431d android | tar -x -C "$previous"
          cd "$previous/android"
          bash "$GITHUB_WORKSPACE/android/ci/run-gradle-check.sh" :app:assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Room, backup and Compose UI tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          disable-spellchecker: true
          working-directory: android
          script: |
            set -e
            bash ci/run-device-tests.sh
            MYVAULT_DISPOSABLE_EMULATOR=1 MYVAULT_REQUIRE_CUTOUT=1 bash ci/run-motion-inset-tests.sh
            if [ '${{ matrix.api }}' = '30' ]; then
              MYVAULT_DISPOSABLE_EMULATOR=1 bash ci/capture-synthetic-ui.sh
            fi
            MYVAULT_DISPOSABLE_EMULATOR=1 \
              MYVAULT_PREVIOUS_APK="$RUNNER_TEMP/myvault-previous/android/app/build/outputs/apk/debug/app-debug.apk" \
              bash ci/run-offline-restart-test.sh
      - name: Upload synthetic UI screenshots
        if: ${{ always() && matrix.api == 30 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myvault-android-synthetic-screenshots
          path: android/app/build/reports/synthetic-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload test report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myvault-android-test-report-api-${{ matrix.api }}
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Signed release APK
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require the default branch for signing
        env:
          CURRENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$CURRENT_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run signed releases from the default branch only."
            exit 1
          fi
      - name: Check out trusted sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check Android app sources
        run: bash android/ci/check-project.sh
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-disabled: true
      - name: Validate signing secrets and prepare keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash android/ci/prepare-signing.sh
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PrequireReleaseSigning=true :app:assembleRelease
      - name: Verify the release signature
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash android/ci/verify-signing.sh android/app/build/outputs/apk/release/app-release.apk
      - name: Remove the temporary keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/myvault-release.keystore"
      - name: Upload signed release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myvault-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
